# picom compositor: rounded corners, soft shadows, fades, slight dim of unfocused windows
# test changes: pkill picom; picom &      (or reload i3 / log out)

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;

# ---------------------------------------------------------------- corners
corner-radius = 8;
# redraws i3's border along the rounded corners (BORDER in the shader = i3 border width)
window-shader-fg = "rounded-border.frag";
rounded-corners-exclude = [
  "window_type = 'dock'",              # polybar draws its own radius
  "window_type = 'desktop'",
  "class_g = 'i3-frame'",              # i3 tab / stack title bars
  "class_g = 'i3lock'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ---------------------------------------------------------------- shadows
shadow = true;
shadow-radius = 14;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-opacity = 0.45;
shadow-color = "#000000";
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'i3-frame'",
  "class_g = 'i3lock'",
  "_GTK_FRAME_EXTENTS@:c",             # GTK CSD windows draw their own
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ---------------------------------------------------------------- fading
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 8;
fade-exclude = [ "class_g = 'i3lock'" ];

# ---------------------------------------------------------------- dim unfocused
inactive-dim = 0.10;
focus-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "class_g = 'i3lock'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ---------------------------------------------------------------- blur (only shows behind transparent windows)
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3lock'",
  "_GTK_FRAME_EXTENTS@:c"
];

wintypes:
{
  tooltip       = { fade = true; shadow = false; focus = true; };
  dnd           = { shadow = false; };
  popup_menu    = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
