# lightdm-gtk-greeter config (installed to /etc/lightdm/lightdm-gtk-greeter.conf)
# Gruvbox theme matching the i3 / polybar setup. See system/install-login.sh
[greeter]
theme-name = MyConfigs-Greeter
icon-theme-name = Adwaita
cursor-theme-name = DMZ-White
font-name = JetBrains Mono 12
background = /usr/share/backgrounds/myconfigs/wallpaper.jpg
user-background = false
transition-type = none

# card sits over the stripes on the left, like it's part of the wallpaper
position = 28%,center 50%,center
hide-user-image = true

panel-position = top
indicators = ~host;~spacer;~clock;~spacer;~layout;~session;~a11y;~power
clock-format = %a %d.%m.  %H:%M
keyboard-layouts = us;hr

default-session = i3

xft-antialias = true
xft-hintstyle = slight
xft-rgba = rgb
