[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/main]
monitor = ${env:MONITOR:}
fixed-center = true

width = 100%
height = 22pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

; no "|" separators - icons separate modules, small gap between them
module-margin = 1
separator =

font-0 = monospace;2
; icons (Font Awesome 4, package fonts-font-awesome)
font-1 = FontAwesome:size=10;2
; same font as the login screen (used by the date)
font-2 = JetBrains Mono:style=Bold:size=11;3

modules-left = xworkspaces xwindow
modules-center = date
modules-right = headphones pulseaudio brightness xkeyboard cpu memory wlan eth battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xwindow]
type = internal/xwindow
label = %title:0:30:…%
label-foreground = ${colors.disabled}

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/i3
index-sort = true
pin-workspaces = false

; Fokusirani workspace
label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

; Workspaceovi na ISTOM monitoru (monitor A)
label-unfocused = %name%
label-unfocused-padding = 1

; Workspaceovi na DRUGOM monitoru (monitor B)
label-visible = %name%·
label-visible-padding = 1
label-visible-foreground = ${colors.foreground}

; Urgent
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

; Sony WH-CH720N battery. left click: connect/disconnect, right click: music <-> mic mode
[module/headphones]
type = custom/script
exec = ~/.config/polybar/scripts/headphones.sh
interval = 15
click-left = ~/.local/bin/headphones toggle &
click-right = ~/.local/bin/headphones mic &

; built-in backlight module instead of polling a script 5x per second; scroll to change
[module/brightness]
type = internal/backlight
card = amdgpu_bl1
use-actual-brightness = true
enable-scroll = true
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#F0C674}%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
sink = @DEFAULT_SINK@
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}
label-volume = %percentage%%

label-muted =  mute
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 1
label-indicator-margin = 0
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%{F-} %essid:0:12:…% %{F#707880}%local_ip%%{F-}
label-disconnected = %{F#707880}%{F-}

; only shown when a cable is plugged in
[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%{F-} %local_ip%
label-disconnected =

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 99
low-at = 15
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.primary}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
ramp-capacity-0 = 
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.primary}

format-full = <label-full>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.secondary}
label-full = %percentage%%

format-low = <label-low>
format-low-prefix = " "
format-low-prefix-foreground = ${colors.alert}
label-low = %percentage%%

; same place + format as the login screen clock; click for full date + seconds
[module/date]
type = internal/date
interval = 1
date = %a %d.%m.  %H:%M
date-alt = %d.%m.%Y. %H:%M:%S
label-font = 3
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
